name: Process and send video

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: "Path to your own/permitted video in the repository (example: input/video.mp4)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: maqi-video-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests

      - name: Process video and send to Telegram
        env:
          VIDEO_PATH: ${{ inputs.video_path }}
        run: python bot.py

      - name: Save duplicate-detection state
        run: |
          if [ -f .processed_videos.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .processed_videos.txt
            if ! git diff --cached --quiet; then
              git commit -m "Save processed video fingerprint"
              git push
            fi
          fi
