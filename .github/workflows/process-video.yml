name: Process and send video

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: "Path to your own/licensed video in the repository (for example: input/video.mp4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests

      - name: Process video and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATERMARK_TEXT: ${{ vars.WATERMARK_TEXT }}
          VIDEO_PATH: ${{ inputs.video_path }}
        run: python bot.py
